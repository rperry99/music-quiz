<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="audioBox">
      <div id="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <audio id="quizAudio"></audio>
      <button class="playPause"></button>

      <div class="settingsBox">
        <div class="setting">
          <label for="playbackLength">Playback Length (in seconds)</label>
          <input
            type="number"
            id="playbackLength"
            min="0"
            max="20"
            step="1"
            value="10" />
        </div>
        <div class="setting">
          <label for="guessLength">Guess Length (in seconds)</label>
          <input
            type="number"
            id="guessLength"
            min="0"
            max="10"
            step="1"
            value="5" />
        </div>
        <!-- <div class="nextSong button">New Song</div> -->
      </div>

      <div class="overlay"></div>
      <div class="countdown">
        <svg class="countdownRing" viewBox="0 0 100 100">
          <circle class="ringBackground" cx="50" cy="50" r="45"></circle>
          <circle class="ringProgress" cx="50" cy="50" r="45"></circle>
        </svg>

        <span class="countdownNumber">5</span>
      </div>
    </div>

    <div class="answerBox">
      <div class="closeIcon"></div>
      <div class="albumArt"></div>
      <div class="info">
        <h2 class="songName">Song Name</h2>
        <p class="albumArtist">Artist</p>
        <div class="albumInfo">
          <p class="albumName">Album</p>
          <span class="separator">•</span>
          <p class="albumYear">2024</p>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
